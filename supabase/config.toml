[functions.db-backup-cron]
enabled = true
verify_jwt = false
import_map = "./functions/db-backup-cron/deno.json"
entrypoint = "./functions/db-backup-cron/index.ts"
# Programar en Dashboard → Edge Functions → db-backup-cron → Cron: 0 9 * * * (09:00 UTC)
# Header: x-db-backup-cron-secret = valor de DB_BACKUP_CRON_SECRET
# O invocar manualmente con el mismo header.

[functions.ensayo-salida-recordatorios]
enabled = true
verify_jwt = false
import_map = "./functions/ensayo-salida-recordatorios/deno.json"
entrypoint = "./functions/ensayo-salida-recordatorios/index.ts"
# pg_cron cada 1 min (migración 20260805000000). Secrets:
#   ENSAYO_SALIDA_CRON_SECRET (o DB_BACKUP_CRON_SECRET), GMAIL_*, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
#   VAPID_SUBJECT (opcional), APP_BASE_URL / FRONTEND_URL
# Header: x-ensayo-salida-cron-secret

[functions.ensayo-inicio-recordatorios]
enabled = true
verify_jwt = false
import_map = "./functions/ensayo-inicio-recordatorios/deno.json"
entrypoint = "./functions/ensayo-inicio-recordatorios/index.ts"
# pg_cron cada 1 min (migración 20260806140000). Secrets:
#   ENSAYO_INICIO_CRON_SECRET (o ENSAYO_SALIDA / DB_BACKUP), GMAIL_*, VAPID_*, APP_BASE_URL
# Header: x-ensayo-inicio-cron-secret (también acepta x-ensayo-salida-cron-secret / x-db-backup-cron-secret)
# Gate ONLY_ADMINS=true en código hasta abrir check-in a músicos.

[functions.ensayo-diario-reporte]
enabled = true
verify_jwt = false
import_map = "./functions/ensayo-diario-reporte/deno.json"
entrypoint = "./functions/ensayo-diario-reporte/index.ts"
# pg_cron 01:00 UTC (22:00 ART) — migración 20260806200000.
# Secrets: GMAIL_*, ENSAYO_DIARIO_CRON_SECRET (o SALIDA/DB_BACKUP), APP_BASE_URL
# Opcional: ENSAYO_DIARIO_TO=mail1,mail2 (default filarmonica.scrn + ofrn.archivo)
# Header: x-ensayo-diario-cron-secret
# Body opcional: {"fecha":"YYYY-MM-DD"}

[functions.sync-conciertos-sheet]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-conciertos-sheet/index.ts"
# Cron/trigger: header x-conciertos-sheet-cron-secret = CONCIERTOS_SHEET_CRON_SECRET
# UI: Authorization Bearer (usuario management).
