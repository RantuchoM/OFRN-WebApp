
[functions.sync-scrn-transporte-calendar]
enabled = true
verify_jwt = false
import_map = "./functions/sync-scrn-transporte-calendar/deno.json"
entrypoint = "./functions/sync-scrn-transporte-calendar/index.ts"

[functions.create-calendar-event]
enabled = true
verify_jwt = true
import_map = "./functions/create-calendar-event/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-calendar-event/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-calendar-event/*.html" ]

[functions.create-scrn-perfil]
enabled = true
verify_jwt = true
import_map = "./functions/create-scrn-perfil/deno.json"
entrypoint = "./functions/create-scrn-perfil/index.ts"

[functions.entradas-send-reserva-email]
enabled = true
verify_jwt = true
import_map = "./functions/entradas-send-reserva-email/deno.json"
entrypoint = "./functions/entradas-send-reserva-email/index.ts"

[functions.entradas-cron-mails]
enabled = true
verify_jwt = false
import_map = "./functions/entradas-cron-mails/deno.json"
entrypoint = "./functions/entradas-cron-mails/index.ts"
# Programar en Dashboard → Edge Functions → entradas-cron-mails (p. ej. */15 * * * *)
# o vía pg_cron + http_post al endpoint. Requiere ENTRADAS_CRON_SECRET, GMAIL_*.
# Encuesta sin URL por concierto: default https://linktr.ee/conciertos_ofrn (override: ENTRADAS_ENCUESTA_URL).

[functions.entradas-send-test-mail]
enabled = true
